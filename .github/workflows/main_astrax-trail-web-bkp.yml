name: Build and deploy Next.js app to Azure Web App - astrax-trail-web-bkp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          mkdir -p deploy/.next
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static

          if [ -d "public" ]; then
            cp -r public deploy/public
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2A8563AFAAC24661B62DCA665D4E9F1A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_531EC11FE08C4D459145E8444A83DE2E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_467B57FE1E824E3CB5A05EB31C8ECC8E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: astrax-trail-web-bkp
          slot-name: Production
          package: deploy
